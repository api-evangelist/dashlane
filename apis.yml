aid: dashlane
name: Dashlane
description: 'Dashlane is a password manager and credential-security platform for individuals,
  families, and enterprises, protecting against credential reuse, phishing, and account
  takeover with zero-knowledge encryption, passkey support, and AI-powered phishing
  detection. For developers, Dashlane publishes a read-only Public API (OpenAPI 3.0)
  that returns real-time team data — member roles/status/usage metrics, activated
  devices, and password-health analytics (weak, reused, compromised credentials) —
  authenticated with a bearer DLP token. Dashlane also ships an open-source CLI (dcli),
  a GitHub Action for injecting vault secrets into CI/CD, SCIM provisioning, and SSO
  federation.'
